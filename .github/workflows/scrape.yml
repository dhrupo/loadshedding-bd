name: scrape

on:
  schedule:
    - cron: "15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: node --test tests/js/*.test.js
      - run: python scraper/pgb.py
      - run: python scraper/sources.py
        continue-on-error: true
      - run: python scraper/pdf_sources.py
        continue-on-error: true
      - run: python scraper/weather.py
        continue-on-error: true
      - run: python scraper/bmd.py
        continue-on-error: true
      - run: python scraper/utilities.py
        continue-on-error: true
      - run: python scraper/forecast.py
        continue-on-error: true
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
      - name: Publish the page with the fresh data
        run: mkdir _site && cp -r index.html static data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
