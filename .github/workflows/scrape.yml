name: scrape

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: node --test tests/js/*.test.js
      - run: python scraper/pgb.py
      - run: python scraper/sources.py
        continue-on-error: true
      - run: python scraper/pdf_sources.py
        continue-on-error: true
      - run: python scraper/weather.py
        continue-on-error: true
      - run: python scraper/bmd.py
        continue-on-error: true
      - run: python scraper/utilities.py
        continue-on-error: true
      - run: python scraper/forecast.py
        continue-on-error: true
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
